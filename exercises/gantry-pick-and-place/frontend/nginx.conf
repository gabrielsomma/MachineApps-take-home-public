server {
    listen 80;
    root /usr/share/nginx/html;

    # API: forward to the backend container, so the browser only talks to
    # one origin (no CORS needed).
    location /rpc/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # The telemetry stream never ends and sends ~20 messages/s: pass each
        # one through immediately instead of buffering the response.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Dashboard (single-page app).
    location / {
        try_files $uri /index.html;
    }
}
